name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Если в репозиторий загружен архив tavr.zip — распаковываем его
      - name: Unpack tavr.zip
        run: |
          if [ -f tavr.zip ]; then unzip -o -q tavr.zip -d unpacked && echo "PROJECT=unpacked/tavr" >> $GITHUB_ENV; else echo "PROJECT=." >> $GITHUB_ENV; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: ${{ env.PROJECT }}
        run: |
          chmod +x gradlew
          ./gradlew :geo:test :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: tavr-apk
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/*.apk
